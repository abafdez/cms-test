name: Deploy to GitHub Pages

# Every push to main, including the commits Sveltia CMS makes when you save, rebuilds
# and redeploys the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # clone the repo
  pages: write # create a Pages deployment
  id-token: write # let deploy-pages prove who it is

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm, Node and dependencies
        uses: pnpm/setup@v3.0.0
        with:
          cache: true
          runtime: node@24

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
